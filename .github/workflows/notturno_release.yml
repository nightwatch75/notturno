name: Notturno release

# Push a tag like v4.32.1.1 to publish signed APKs on GitHub. The app checks the latest release for updates.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        run: echo "${{ secrets.NOTTURNO_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/notturno-release.jks"

      - name: Build signed release APKs
        env:
          NOTTURNO_STORE_FILE: ${{ runner.temp }}/notturno-release.jks
          NOTTURNO_STORE_PASSWORD: ${{ secrets.NOTTURNO_STORE_PASSWORD }}
          NOTTURNO_KEY_ALIAS: ${{ secrets.NOTTURNO_KEY_ALIAS }}
          NOTTURNO_KEY_PASSWORD: ${{ secrets.NOTTURNO_KEY_PASSWORD }}
        run: |
          sed -ri '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode must grow with every release, or Android refuses the update.
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          ./gradlew assembleTempusRelease assembleDegoogledRelease \
            -PnotturnoVersion="$VERSION" -PnotturnoVersionCode="$CODE"

      - name: Name the APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/tempus/release/*.apk "out/notturno-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/degoogled/release/*.apk "out/notturno-${GITHUB_REF_NAME#v}-degoogled.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: out/*.apk
